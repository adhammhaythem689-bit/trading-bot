name: Daily self-analysis re-learn

on:
  schedule:
    - cron: "15 0 * * *"  # once a day at 00:15 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: relearn-state
  cancel-in-progress: false

jobs:
  relearn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the self-analysis + adaptive validation once
        run: python 10_auto_relearn.py --once

      - name: Run test suite before committing new learned filters
        run: python -m pytest tests/ -v

      # always() so a failed run still publishes its run log; the pattern table is only
      # committed when both the run and the test suite succeeded
      - name: Commit updated learning artifacts
        if: always()
        run: |
          git config user.name "trading-bot-ci"
          git config user.email "actions@users.noreply.github.com"
          if [ -d runlog ]; then git add runlog/; fi
          if [ "${{ job.status }}" = "success" ]; then
            git add learned_filters.json relearn_history.csv
          fi
          git diff --quiet --cached || git commit -m "Daily re-learn $(date -u +%Y-%m-%d) (${{ job.status }})"
          git pull --rebase --autostash origin main
          git push
