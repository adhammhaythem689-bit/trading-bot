name: Hourly paper trade check

on:
  schedule:
    # every 15 min at off-peak minutes: GitHub drops many top-of-hour runs, and
    # extra runs are harmless (no new candle -> nothing written, no commit)
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: paper-trade-state
  cancel-in-progress: false  # queue, don't cancel -- we never want a tick silently skipped

jobs:
  paper-trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run paper trader (single check)
        run: python 06_paper_trade.py --once

      # always() so a failed run still publishes its run log (which step broke, and why);
      # trading state is only committed when the run succeeded
      - name: Commit updated state and logs
        if: always()
        run: |
          git config user.name "trading-bot-ci"
          git config user.email "actions@users.noreply.github.com"
          if [ -d runlog ]; then git add runlog/; fi
          if [ "${{ job.status }}" = "success" ]; then
            git add paper_state.json paper_trade_log.csv market_context_log.csv
          fi
          git diff --quiet --cached || git commit -m "Paper trade tick $(date -u +%Y-%m-%dT%H:%M:%SZ) (${{ job.status }})"
          git pull --rebase --autostash origin main
          git push
