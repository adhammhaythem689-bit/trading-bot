name: Hourly paper trade check

on:
  schedule:
    - cron: "5 * * * *"   # 5 minutes past every hour (UTC)
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: paper-trade-state
  cancel-in-progress: false  # queue, don't cancel -- we never want a tick silently skipped

jobs:
  paper-trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run paper trader (single check)
        run: python 06_paper_trade.py --once

      - name: Commit updated state and logs
        run: |
          git config user.name "trading-bot-ci"
          git config user.email "actions@users.noreply.github.com"
          git add paper_state.json paper_trade_log.csv market_context_log.csv
          git diff --quiet --cached || git commit -m "Paper trade tick $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin main
          git push
